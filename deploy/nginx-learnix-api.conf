# Learnix API — copy to VPS:
#   sudo cp deploy/nginx-learnix-api.conf /etc/nginx/sites-available/learnix-api
#   sudo ln -sf /etc/nginx/sites-available/learnix-api /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo mkdir -p /var/www/certbot
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d learnix-api.tw1.ru
#
# Certbot needs /.well-known/acme-challenge/ served by nginx — NOT proxied to Node.

server {
    listen 80;
    listen [::]:80;
    server_name learnix-api.tw1.ru;

    # Let's Encrypt HTTP-01 (required before SSL is issued)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    client_max_body_size 50M;
}

# After certbot succeeds it adds a second server { listen 443 ssl; ... } block
# and usually an HTTP→HTTPS redirect. Do not remove the acme-challenge location
# from the port-80 block — certbot renewals need it.
